<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Elysion Roleplay</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="scene"></div>
  <div class="vignette"></div>
  <div class="grain"></div>

  <main class="loading">
    <section class="brand" aria-label="Elysion Roleplay DarkRP">
      <div class="elysion"><span class="ely">Ely</span><span class="sion">Sion</span></div>
      <div class="subtitle">Roleplay</div>
      <div class="darkrp">DARKRP</div>
    </section>

    <section class="loader">
      <div class="status-row">
        <span id="status">Connexion au serveur...</span>
        <span id="percent">0%</span>
      </div>
      <div class="bar">
        <div id="bar-fill"></div>
        <div class="bar-shine"></div>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
  <div class="music-player">
    <div class="music-left">
        <div class="music-icon">
            ♪
        </div>

        <div class="music-info">
            <span class="music-title">Virus - Werenoi</span>
            <span class="music-subtitle">Carré</span>
        </div>
    </div>

    <div class="music-bars">
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
    </div>

    <button id="muteBtn" class="mute-btn">
        🔊
    </button>

    <input
        id="volume"
        class="volume-slider"
        type="range"
        min="0"
        max="1"
        step="0.01"
        value="0.25"
    >

    <audio id="music" loop>
        <source src="assets/music.mp3" type="audio/mpeg">
    </audio>
</div>
</body>
</html>
