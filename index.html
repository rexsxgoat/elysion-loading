<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Elysion Roleplay</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="scene"></div>
  <div class="vignette"></div>
  <div class="grain"></div>

  <main class="loading">
    <section class="brand" aria-label="Elysion Roleplay DarkRP">
      <div class="elysion"><span class="ely">Ely</span><span class="sion">Sion</span></div>
      <div class="subtitle">Roleplay</div>
      <div class="darkrp">DARKRP</div>
    </section>

    <section class="loader">
      <div class="status-row">
        <span id="status">Connexion au serveur...</span>
        <span id="percent">0%</span>
      </div>
      <div class="bar">
        <div id="bar-fill"></div>
        <div class="bar-shine"></div>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
